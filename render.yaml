services:
  - type: web
    name: dropcart
    runtime: node
    buildCommand: rm -rf .runtime && mkdir -p .runtime && unzip -q dropcart-v26-render-ready.zip -d .runtime && node render-overlay/patch-v26-hero.mjs && node render-overlay/patch-express-auth.mjs && cd .runtime && pnpm install --frozen-lockfile=false && pnpm build
    startCommand: cd .runtime && pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dropcart-db
          property: connectionString

databases:
  - name: dropcart-db
    plan: free
