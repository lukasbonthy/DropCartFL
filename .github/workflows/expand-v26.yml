name: Expand Dropcart V26

on:
  push:
    branches: [main]
    paths:
      - "v26-bundle.tar.gz"
      - ".github/workflows/expand-v26.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand V26 source into repository root
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f v26-bundle.tar.gz ]]; then
            echo "Bundle already expanded; nothing to do."
            exit 0
          fi
          tmp="$(mktemp -d)"
          tar -xzf v26-bundle.tar.gz -C "$tmp"
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name v26-bundle.tar.gz \
            -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -f v26-bundle.tar.gz
          rm -rf "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Replace repository with Dropcart V26"
          git push origin HEAD:main
