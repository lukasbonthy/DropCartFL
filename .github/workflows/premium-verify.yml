name: Verify Dropcart storefront

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "render-overlay/**"
      - ".github/workflows/premium-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-render-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate overlay syntax
        run: |
          node --check render-overlay/patch-v26-hero.mjs
          node --check render-overlay/patch-premium.mjs
      - name: Expand and patch the production bundle
        run: |
          mkdir -p .runtime
          unzip -q dropcart-v26-render-ready.zip -d .runtime
          node render-overlay/patch-v26-hero.mjs
          grep -q 'dropcart-premium.css' .runtime/app/globals.css
          grep -q '<QuoteBuilder />' .runtime/app/page.tsx
          grep -q 'window.addEventListener(LOAD_SELECTION_EVENT' .runtime/components/booking-form.tsx
      - name: Install runtime dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          cd .runtime
          pnpm install --frozen-lockfile=false
      - name: Build actual Render runtime
        run: |
          cd .runtime
          pnpm build
